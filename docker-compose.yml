version: "3.9"

services:
  web:
    build: .
    container_name: istakip-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database in a dedicated data directory
      - db_data:/app/data
      # Static files volume
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-me-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_DIR=/app/data
      # Optional: auto-create superuser on first run
      # - DJANGO_SUPERUSER_USERNAME=admin
      # - DJANGO_SUPERUSER_EMAIL=admin@example.com
      # - DJANGO_SUPERUSER_PASSWORD=admin123
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  db_data:
    name: istakip_db_data
  static_volume:
    name: istakip_static_data
